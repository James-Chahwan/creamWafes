[project]
name = "layerdaw"
version = "0.1.0"
description = "Native mini-DAW with AI layer generation (ACE-Step)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
    "numpy>=2.0",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "scipy>=1.13",
]

[project.scripts]
layerdaw = "layerdaw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
